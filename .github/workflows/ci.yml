name: CI - Integracao Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    name: Verificacao Estatica, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias (Instalacao Reproduzivel)
        run: npm ci

      - name: Executar Suite de Testes (Unitarios e Integracao)
        run: npm run test

      - name: Compilacao de Producao e Verificacao de Tipos (astro check + build)
        run: npm run build